name: tenuo/agent-review
# Runs the base branch's copy of this workflow and gate (pull_request_target,
# issue_comment), never code from the pull request, so a PR cannot edit its own check.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  checks: write
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: tenuo-agent-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
jobs:
  gate:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check tenuo==0.3.7
      - run: python -I .github/tenuo/run_check.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
