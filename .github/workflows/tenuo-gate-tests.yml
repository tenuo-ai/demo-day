name: tenuo gate tests
on:
  push:
    paths: [".github/tenuo/**"]
  pull_request:
    paths: [".github/tenuo/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund && npm test
        working-directory: .github/tenuo
