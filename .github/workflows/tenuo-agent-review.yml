name: tenuo/agent-review
# Runs the base branch's copy of this workflow and gate (pull_request_target,
# issue_comment), never code from the pull request, so a PR cannot edit its own check.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created, edited, deleted]
permissions:
  checks: write
  contents: read
  issues: read
  pull-requests: read
concurrency:
  group: tenuo-agent-review-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false
jobs:
  gate:
    if: github.event_name == 'pull_request_target' || github.event.issue.pull_request
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
        working-directory: .github/tenuo
      - run: node run_check.mjs
        working-directory: .github/tenuo
        env:
          GITHUB_TOKEN: ${{ github.token }}
