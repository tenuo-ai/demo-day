name: tenuo gate tests
on:
  push:
    paths: [".github/tenuo/**"]
  pull_request:
    paths: [".github/tenuo/**"]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check tenuo==0.3.7 pytest
      - run: python -I -m pytest -q .github/tenuo/test_gate.py
